<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Match Intelligence</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- CSS bude vloženo sem -->
<style id="css-here"></style>

</head>
<body>

<div class="shell">
    <div class="frame">
        <div class="terminal">

            <div class="top-row">
                <h1>MATCH INTELLIGENCE</h1>
                <div class="badge">
                    <span class="badge-dot"></span>
                    DARK SYNDICATE TERMINAL
                </div>
            </div>

            <div class="layout">
                <div class="panel">
                    <div class="panel-label">TÝM A – DOMÁCÍ</div>
                    <textarea id="homeInput" class="input-box" placeholder="Sem vlož blok pro domácí tým..."></textarea>
                </div>

                <div class="panel">
                    <div class="panel-label">TÝM B – HOSTÉ</div>
                    <textarea id="awayInput" class="input-box" placeholder="Sem vlož blok pro hostující tým..."></textarea>
                </div>
            </div>

            <div class="buttons">
                <button onclick="generatePrompt()">GENEROVAT INTELLIGENCE</button>
                <button onclick="copyPrompt()">KOPÍROVAT</button>
                <button onclick="clearAll()">VYMAZAT</button>
            </div>

            <div class="panel" style="margin-top:14px;">
                <div class="panel-label">Match Intelligence Report</div>
                <textarea id="promptOutput" class="output-box" placeholder="Zde se objeví Match Intelligence Report..."></textarea>
            </div>

        </div>
    </div>
</div>

<!-- JS bude vloženo sem -->
<script id="js-here"></script>

</body>
</html>
